package com.vodafone.cash_taf.tests.bill_payment.stepdefinitions;

import com.vodafone.cash_taf.tests.CommonStepDefs;
import com.vodafone.cash_taf.tests.bill_payment.utils.ExcelUtils;
import com.vodafone.cash_taf.tests.bill_payment.Enum.CategoryType;
import com.vodafone.cash_taf.tests.bill_payment.Enum.CompanyType;
import com.vodafone.ussd_taf.tests.CommonTests.UssdTransactionStepDef;
import io.cucumber.java.en.*;


import java.util.List;
import java.util.Properties;

public class StepDefs
{

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Private Variables to store CompanyName , CompanyCode , CompanyCategory
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private String companyCode;
    private String categoryCode;
    private CategoryType companyCategory;
    private CompanyType selectedCompany;

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Billing Account Number and Billing Payment USSD Code
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private String billingAccountNumber;
    private String currentBillPaymentCode;
    private String confirmationPaymentCode;

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Private Variables to store Bill paid or not
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private boolean ElectricityBill = false;
    private boolean WaterBill = false;
    private boolean GasBill = false;

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Given Variables for read Testing Data from Excel sheet
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private boolean stopExcelLoop = false;
    private static List<String[]> excelData;
    private static int currentRowIndex = 0;
    private String[] currentRow;

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Properties object to simulate USSD options storage
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private Properties ussdRatePlanPropertiesUtilities = new Properties();
    private Properties ussdConfirmationPaymentCode = new Properties();

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Create object from UssdSteps to validate pop up messages "Expected , Actual"
    // ─────────────────────────────────────────────────────────────────────────────────────//
    UssdSteps ussdSteps = new UssdSteps();

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Create Two Objects "commnStepDefs , UssdDef" for calling builtin functions
    // ─────────────────────────────────────────────────────────────────────────────────────//
    CommonStepDefs commnStepDefs = new CommonStepDefs();
    UssdTransactionStepDef UssdDef = new UssdTransactionStepDef();

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //  Read Values from Placeholder "msisdn" , "shortCode" , "checkAvailableBalanceOptions"
    // "expectedResponseForCheckBillLessThan50LE"
    // ─────────────────────────────────────────────────────────────────────────────────────//
    String msisdnPlaceholder = ussdRatePlanPropertiesUtilities.getProperty("<msisdn>");
    String shortCodePlaceholder = ussdRatePlanPropertiesUtilities.getProperty("<shortCode>");
    String balanceInquiryOptionsPlaceholder = ussdRatePlanPropertiesUtilities.getProperty(("<balanceInquiryOptions>"));
    String expectedResponseForCheckBillLessThan50LE = ussdRatePlanPropertiesUtilities.getProperty(("<expectedResponse>"));

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //                 GIVEN Read Data Testing From Excel Sheet
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @Given("Read Data Testing From Excel Sheet")
    public void Start_Scenario()
    {
        if (excelData == null) {
            excelData = ExcelUtils.readAllRows(
                    "D:/AutomationWork/Cash_Regression_Framework/" +
                            "VFCash_Regression_Framework/VFCash_Framework/resources/Data/DataTesting.xlsx"
            );
        }
        while (currentRowIndex < excelData.size())
        {
            // Stop Read from Excel sheet if paid 3 bills "Electricity , Water , Gas"
            if (stopExcelLoop)
            {
                break;  // Stop reading Excel rows
            }

            currentRow = excelData.get(currentRowIndex);

            // STEP 1- Load Company Data
            if (!executeStep(1)) {currentRowIndex++;continue;}

            // STEP 2- IsBillPaid
            if (!executeStep(2)) {currentRowIndex++;continue;}

            // STEP 3- USSD Framework for implementation
            if (!executeStep(3)) {currentRowIndex++;continue;}

            // STEP 4- Generate Bill Payment Ussd Code
            if (!executeStep(4)) {currentRowIndex++;continue;}

            // STEP 5- Validate MessageResopnse text appeared correctly and amount < 50 LE
            if (!executeStep(5)) {currentRowIndex++;continue;}

            // STEP 6- Generate Confirmation Payment Ussd Code
            if (!executeStep(6)) {currentRowIndex++;continue;}

            // STEP 7- Calculate deducted amount from wallet balance
            if (!executeStep(7)) {currentRowIndex++;continue;}

            // Step 8- validate that deducted amount from wallet balance equal to extracted transaction amount
            if (!executeStep(8)) {currentRowIndex++;continue;}

            currentRowIndex++;
        }

    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Function tha pass BTC_Name to load all data for specific every Company
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private void loadCompanyData(String BTC_NAME) throws Exception
    {
        selectedCompany = CompanyType.fromName(BTC_NAME);
        if (selectedCompany == null)
        {
            throw new Exception("Company name NOT found in enum: " + BTC_NAME);
        }

        companyCode     = selectedCompany.getCode();
        companyCategory = selectedCompany.getCategory();
        categoryCode = companyCategory.getCode();
    }
//───────────────────────────────────────────────────────────────────────────────────────────────//
    // ─────────────────────────────────────────────────────────────────────────────────────//
    //                          Generate Bill Payment USSD Code
    // ─────────────────────────────────────────────────────────────────────────────────────//
    public String GenerateBillPaymentCode(CategoryType category) {
        switch (category)
        {
            case ELECTRICITY:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1";
            case WATER:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1";
            case GAS:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1" ;
            default:
                return "";
        }
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    //            Set placeholder for BillPaymentCode to check invoice amount
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @Then("Set BillPaymentCode placeholder")
    public void setBillPaymentCodePlaceholder()
    {
        if (currentRowIndex >= excelData.size()) return;
        ussdRatePlanPropertiesUtilities .setProperty("<BillPaymentCode>", currentBillPaymentCode);
    }
//───────────────────────────────────────────────────────────────────────────────────────────────//
    // ─────────────────────────────────────────────────────────────────────────────────────//
    //                          Generate Confirmation Payment USSD Code
    // ─────────────────────────────────────────────────────────────────────────────────────//
    public String GenerateConfirmationPaymentCode(CategoryType category) {
        switch (category) {
            case ELECTRICITY:
                return "4," + categoryCode+ "," + companyCode + "," + billingAccountNumber + ",1" + ",100100";
            case WATER:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1" + ",100100";
            case GAS:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1" + "100100" ;
            default:
                return "";
        }
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    //            Set placeholder for  Confirmation Bill Payment Ussd Code
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @Then("Set ConfirmationPaymentCode placeholder")
    public void setConfirmationPaymentCodePlaceholder()
    {
        if (currentRowIndex >= excelData.size()) return;
        ussdConfirmationPaymentCode .setProperty("<confirmationpaymentcode>", confirmationPaymentCode);
    }
//───────────────────────────────────────────────────────────────────────────────────────────────//
    // ─────────────────────────────────────────────────────────────────────────────────────//
    //                                EXECUTE EACH STEP
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private boolean executeStep(int stepNumber) {
        try {
            switch (stepNumber) {
                // Step 1— Load company name
                case 1:
                    String btcName = currentRow[1];
                    loadCompanyData(btcName);
                    billingAccountNumber = currentRow[10];
                    return true;
      // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 2— Check 3 bills is paid or not
                case 2:
                    if (ElectricityBill && WaterBill && GasBill)
                    {
                        stopExcelLoop = true;
                        currentRowIndex = excelData.size();
                        return true;
                    }
                    // Check if paid one Electricity bill
                    if ("1".equals(categoryCode))
                    {
                        if (ElectricityBill)
                        {
                            currentRowIndex++;
                        }
                        return true;
                    }

                    // Check if paid one Water bill
                    if ("2".equals(categoryCode))
                    {
                        if (WaterBill)
                        {
                            currentRowIndex++;
                        }
                        return true;
                    }

                    // Check if paid one Gas bill
                    if ("3".equals(categoryCode))
                    {
                        if (GasBill)
                        {
                            currentRowIndex++;
                        }
                        return true;
                    }
                    return true;
      // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 3— Navigate USSD Framework
                case 3:
                    commnStepDefs.refreshCurrentUrl();
                    UssdDef.switchToUssdFrame();

                    if (msisdnPlaceholder == null || shortCodePlaceholder == null)
                    {
                        throw new Exception("Placeholders <msisdn> or <shortCode> not set in properties");
                    }

                    // Pass values to function for implementation

                    UssdDef.enterMsisdnInUssdPage(msisdnPlaceholder);
                    UssdDef.enterShortCodeInUssdPage(shortCodePlaceholder);
                    UssdDef.clickOnSendButtonInUssdPageWithMsisdnAndShortcode(msisdnPlaceholder, shortCodePlaceholder);

                    // Save Initial balance before transaction

                    UssdDef.enterOptionsInUssd(balanceInquiryOptionsPlaceholder);
                    commnStepDefs.storeInitialBalanceBeforeTransaction();

                    commnStepDefs.refreshCurrentUrl();
                    UssdDef.switchToUssdFrame();

                    return true;
      // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 4— Generate Bill Payment Ussd Code
                case 4:
                    currentBillPaymentCode = GenerateBillPaymentCode(companyCategory);
                    setBillPaymentCodePlaceholder();

                    // Pass values to function for implementation
                    UssdDef.enterMsisdnInUssdPage(msisdnPlaceholder);
                    UssdDef.enterShortCodeInUssdPage(shortCodePlaceholder);
                    UssdDef.clickOnSendButtonInUssdPageWithMsisdnAndShortcode(msisdnPlaceholder, shortCodePlaceholder);
                    UssdDef.enterOptionsInUssdPage(currentBillPaymentCode);

                    return true;
      // ─────────────────────────────────────────────────────────────────────────────────────//
                // STEP 5- Validate MessageResopnse text appeared correctly and amount < 50 LE
                case 5:
                    boolean checkMessageToContinue = ussdSteps.validateActualResponseForAmountLessThan50LE(expectedResponseForCheckBillLessThan50LE);
                    return checkMessageToContinue;
      // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 6— Generate Confirmation Payment Ussd Code
                case 6:
                    confirmationPaymentCode = GenerateConfirmationPaymentCode(companyCategory);
                    setConfirmationPaymentCodePlaceholder();

                    commnStepDefs.refreshCurrentUrl();
                    UssdDef.switchToUssdFrame();

                    UssdDef.enterMsisdnInUssdPage(msisdnPlaceholder);
                    UssdDef.enterShortCodeInUssdPage(shortCodePlaceholder);
                    UssdDef.clickOnSendButtonInUssdPageWithMsisdnAndShortcode(msisdnPlaceholder, shortCodePlaceholder);
                    UssdDef.enterOptionsInUssdPage(confirmationPaymentCode);



                    return true;
      // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 7— Calculate deducted amount from wallet balance
                case 7:

                    commnStepDefs.refreshCurrentUrl();

                    UssdDef.switchToUssdFrame();
                    UssdDef.enterMsisdnInUssdPage(msisdnPlaceholder);
                    UssdDef.enterShortCodeInUssdPage(shortCodePlaceholder);
                    UssdDef.clickOnSendButtonInUssdPageWithMsisdnAndShortcode(msisdnPlaceholder, shortCodePlaceholder);
                    UssdDef.enterOptionsInUssdPage(balanceInquiryOptionsPlaceholder);

                    commnStepDefs.storeBalanceAfterTransaction();
                    commnStepDefs.getInitialBalanceBeforeTransaction();
                    commnStepDefs.getBalanceAfterTransaction();
                    commnStepDefs.calculateDeductedAmountFromWalletBalance();
                    commnStepDefs.getTransactionAmount();

                    if ("1".equals(categoryCode)) {
                        ElectricityBill = true;
                    }

                    else if ("2".equals(categoryCode)) {
                        WaterBill = true;
                    }

                    else if ("3".equals(categoryCode)) {
                        GasBill = true;
                    }

                    return true;
      // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 8— validate that deducted amount from wallet balance equal
                // to extracted transaction amount
                case 8:
                    ussdSteps.checkThatDeductedAmountFromWalletBalanceEqualToExtractedTransactionAmount();

                default:
                    return false;
            }

        } catch (Exception e) {
            return false;
        }
    }

}
