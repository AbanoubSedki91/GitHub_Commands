    public String GenerateBillPaymentCode(CategoryType category)
    {
        switch (category)
        {
            case ELECTRICITY:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1";
            case WATER:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1";
            case GAS:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1";
            default:
                return "";
        }
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    //                          Generate Confirmation Bill Payment USSD Code
    // ─────────────────────────────────────────────────────────────────────────────────────//
    public String GenerateConfirmationPaymentCode(CategoryType category)
    {
        switch (category)
        {
            case ELECTRICITY:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1" + ",100100";
            case WATER:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1" + ",100100";
            case GAS:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1" + ",100100";
            default:
                return "";
        }
    }
   //───────────────────────────────────────────────────────────────────────────────────────────────//
   public boolean validateActualResponseForAmountLessThan50LE(String expectedResponse1)
   {
       try {
           String actualResponse = "";
           int attempts = 0;

           // Wait max 5 seconds (10 * 500ms)
           while ((actualResponse == null || actualResponse.trim().isEmpty()) && attempts < 10) {
               Thread.sleep(500);
               actualResponse = browser.ussd.networkBrowserStudio.getResponseText();
               attempts++;
           }

           if (actualResponse == null) {
               System.out.println("No response received from USSD.");
               return false;
           }

           actualResponse = actualResponse.trim().replaceAll("\\s+", " ");

           // Get expected text from properties
           String expectedText = ussdResponsesProperties.getProperty(expectedResponse1);

           if (expectedText == null) {
               System.out.println("Property key not found: " + expectedResponse1);
               return false;
           }

           expectedText = expectedText.trim().replaceAll("\\s+", " ");

           // --- Normalize text (remove numbers) ---
           String normalizedExpectedText = expectedText
                   .replaceAll("\\d+(\\.\\d+)?", "")
                   .replaceAll("\\s+", " ")
                   .trim();

           String normalizedActualText = actualResponse
                   .replaceAll("\\d+(\\.\\d+)?", "")
                   .replaceAll("\\s+", " ")
                   .trim();

           System.out.println("Actual Response: " + actualResponse);
           System.out.println("Expected Text (resolved): " + expectedText);
           System.out.println("Normalized Actual: " + normalizedActualText);
           System.out.println("Normalized Expected: " + normalizedExpectedText);

           boolean containsText = normalizedActualText.toLowerCase()
                   .contains(normalizedExpectedText.toLowerCase());

           // ---- Extract only the FIRST amount ----
           java.util.regex.Pattern p = java.util.regex.Pattern.compile("(\\d+(\\.\\d+)?)");
           java.util.regex.Matcher m = p.matcher(actualResponse);

           double amount = 0;
           if (m.find()) {
               amount = Double.parseDouble(m.group(1));
           }

           boolean amountCheck = amount < 50;

           System.out.println("Amount extracted: " + amount);
           System.out.println("Text Match Result: " + containsText);
           System.out.println("Final Result of Validation: " + (containsText && amountCheck));

           return containsText && amountCheck;

       } catch (Exception e) {
           e.printStackTrace();
           return false;
       }
   }
    //───────────────────────────────────────────────────────────────────────────────────────────────//
    public boolean validateActualResponseForConfirmationPayment(String expectedResponse2)
    {
        try {
            String actualResponse = "";
            int attempts = 0;

            // Wait max 5 seconds (10 * 500ms)
            while ((actualResponse == null || actualResponse.trim().isEmpty()) && attempts < 10) {
                Thread.sleep(500);
                actualResponse = browser.ussd.networkBrowserStudio.getResponseText();
                attempts++;
            }

            if (actualResponse == null) {
                System.out.println("No response received from USSD.");
                return false;
            }

            actualResponse = actualResponse.trim().replaceAll("\\s+", " ");

            // Get expected text from properties
            String expectedText = ussdResponsesProperties.getProperty(expectedResponse2);

            if (expectedText == null) {
                System.out.println("Property key not found: " + expectedResponse2);
                return false;
            }

            expectedText = expectedText.trim().replaceAll("\\s+", " ");

            // Normalize text (remove extra spaces)
            String normalizedActualText = actualResponse.replaceAll("\\s+", " ").trim();
            String normalizedExpectedText = expectedText.replaceAll("\\s+", " ").trim();

            System.out.println("Actual Response: " + actualResponse);
            System.out.println("Expected Text: " + expectedText);
            System.out.println("Normalized Actual: " + normalizedActualText);
            System.out.println("Normalized Expected: " + normalizedExpectedText);


            boolean result = !normalizedActualText.equalsIgnoreCase(normalizedExpectedText);

            System.out.println("Final Result (true = texts not matching): " + result);

            return result;

        } catch (Exception e) {
            e.printStackTrace();
            return false;
        }
    }

