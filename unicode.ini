package com.vodafone.cash_taf.tests.bill_payment.stepdefinitions;

import com.vodafone.ussd_taf.tests.BaseTest;
import io.cucumber.java.en.And;
import com.vodafone.cash_taf.tests.CommonStepDefs;

public class UssdSteps extends BaseTest
{
    // ─────────────────────────────────────────────────────────────────────────────────────//
    //                 Steps Implementation For every bill
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @And ("Load Company Data")
    public void step1(){ }

    @And ("IsBillPaid")
    public void step2(){ }

    @And ("Reload the current page")
    public void step1commnStepDefs(){ }

    @And("Navigate to ussdFrame")
    public void step1Ussd(){ }

    @And ("Start working on USSD framework")
    public void step3(){ }

    @And("Put msisdn {string} in ussd page")
    public void step2Ussd(){ }

    @And ("Put shortcode {string} in ussd page")
    public void step3Ussd(){ }

    @And ("Press on send button in ussd page with msisdn {string} and shortcode {string}")
    public void step4Ussd(){ }

    @And("Put options {string} in ussd")
    public void step5Ussd(){ }

    @And("Save initial balance before transaction")
    public void step2commnStepDefs(){ }

    @And("Save balance after transaction")
    public void step3commnStepDefs(){ }

    @And("Fetch initial balance before transaction")
    public void step4commnStepDefs(){ }

    @And("Fetch balance after transaction")
    public void step5commnStepDefs(){ }

    @And("Compute deducted amount from wallet balance")
    public void step6commnStepDefs(){ }

    @And("Fetch transaction amount")
    public void step7commnStepDefs(){ }


    @And ("Generate bill payment code for current category")
    public void step4(){ }

    @And ("Generate Confirmation Payment Code")
    public void step6(){ }

    // ─────────────────────────────────────────────────────────────────────────────────────//
    @And("validate That Actual Response For Amount Less Than 50LE {string}")
    public void  step8commnStepDefs() {}

    public boolean validateActualResponseForAmountLessThan50LE(String expectedResponse)
    {
        try {
            // Read real response message from USSD framework
            String actualResponse = browser.ussd.networkBrowserStudio.getResponseText().trim().replaceAll("\\s+", " ");

            // Validate Text on Response Message
            boolean containsText = actualResponse.trim().replaceAll("\\s+", " ")
                    .contains(expectedResponse.trim().replaceAll("\\s+", " "));

            // Validate transaction balance less than 50 LE
            String amountString = actualResponse.replaceAll("[^\\d]", "");
            int amount = !amountString.isEmpty() ? Integer.parseInt(amountString) : 0;
            boolean amountCheck = amount < 50;

            // Return True if two conditions achieved
            return containsText && amountCheck;

        }
        catch (Exception e)
        {
            return false;
        }
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @And ("Check that deducted amount from wallet balance equal to extracted transaction amount")
   public void  step9commnStepDefs(){ }

    private String getExpectedBundleAmount() {
        try {
            java.lang.reflect.Field field =
                    CommonStepDefs.class.getDeclaredField("expectedBundleAmount");

            field.setAccessible(true);
            return (String) field.get(null);
        }
        catch (Exception e) {
            return null;
        }
    }

    public void checkThatDeductedAmountFromWalletBalanceEqualToExtractedTransactionAmount()
    {
        String expected = getExpectedBundleAmount();
        double transactionAmount = Math.round(Double.parseDouble(expected)) * 100.0 / 100.0;
        double deductedAmount = browser.ussd.networkBrowserStudio.getDeductionAmount();

        try
        {
            if (deductedAmount != transactionAmount) { }

        } catch (Exception ignored) { }
    }
}
