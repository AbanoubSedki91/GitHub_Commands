    public void bypassRequestInProgress() {
        int attempts = 0;
        int maxAttempts = 60; // Max wait 30 sec (60 * 500ms)
        String actualResponse = "";

        while (attempts < maxAttempts) {
            actualResponse = browser.ussd.networkBrowserStudio.getResponseText();
            System.out.println("Actual text: " + actualResponse);

            if (actualResponse == null) {
                System.out.println("No response yet.");
            } else if (!actualResponse.contains("Request in progress")) {
                System.out.println("Response received: " + actualResponse);
                break;
            }

            attempts++;
            try {
                Thread.sleep(500);
            } catch (InterruptedException e) {
                e.printStackTrace();
            }
        }

        if (attempts == maxAttempts) {
            System.out.println("Warning: Timeout waiting for response!");
        }
    }

