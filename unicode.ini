    // ─────────────────────────────────────────────────────────────────────────────────────//
    //                  Start Scenario to pay 3 bills "Electricity , Water , Gas"
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @And("Automate Bill Payment Flow Using Data Provider via Excel Sheet {string} {string} {string} {string} {string}")
    public void Start_Scenario(String msisdn, String shortcode, String balanceInquiryOptions , String expectedResponse1 , String expectedResponse2 )
    {
        this.msisdn = msisdn;
        this.shortcode = shortcode;
        this.balanceInquiryOptions = balanceInquiryOptions;
        this.expectedResponseForCheckBillLessThan50LE = expectedResponse1;
        this.expectedResponseForConfirmationPayment = expectedResponse2;

        if (excelData == null)
        {
            excelData = ExcelUtils.readAllRows("resources/Data/DataTesting.xlsx");
        }
        while (currentRowIndex < excelData.size())
        {
            // Stop Read from Excel sheet if paid 3 bills "Electricity , Water , Gas"
            if (stopExcelLoop) {
                break;  // Stop reading Excel rows
            }

            currentRow = excelData.get(currentRowIndex);
            System.out.println("Current Row For Testing is : "+ currentRowIndex);

            // STEP 1- Load Company Data
            if (!executeStep(1)) {
                currentRowIndex++;
                continue;
            }

            // STEP 2- IsBillPaid
            if (!executeStep(2)) {
                currentRowIndex++;
                continue;
            }

            // STEP 3- USSD Framework for implementation
            if (!executeStep(3)) {
                currentRowIndex++;
                resetScenarioState();
                continue;
            }

            // STEP 4- Generate Bill Payment Ussd Code
            if (!executeStep(4)) {
                currentRowIndex++;
                resetScenarioState();
                continue;
            }

            // STEP 5- Validate MessageResopnse text appeared correctly and amount < 50 LE
            if (!executeStep(5)) {
                currentRowIndex++;
                resetScenarioState();
                continue;
            }

            // STEP 6- Generate Confirmation Payment Ussd Code
            if (!executeStep(6)) {
                currentRowIndex++;
                resetScenarioState();
                continue;
            }

            // STEP 7- Validate MessageResopnse text appeared "Payment done or not"
            if (!executeStep(7)) {
                currentRowIndex++;
                resetScenarioState();
                continue;
            }

            // STEP 8- Calculate deducted amount from wallet balance
            if (!executeStep(8)) {
                currentRowIndex++;
                resetScenarioState();
                continue;
            }

            // Step 9- validate that deducted amount from wallet balance equal to extracted transaction amount
            if (!executeStep(9)) {
                currentRowIndex++;
                resetScenarioState();
                continue;
            }

            currentRowIndex++;
        }
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    //                                EXECUTE EACH STEP
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private boolean executeStep (int stepNumber)
    {
        try {
            switch (stepNumber) {
                // Step 1— Load company namegit
                case 1:
                    String btcName = currentRow[1];
                    loadCompanyData(btcName);
                    billingAccountNumber = currentRow[10];
                    System.out.println("Ready for Testing : "+ currentRowIndex);
                    return true;
                // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 2— Check 3 bills is paid or not
                case 2:
                    if (ElectricityBill && WaterBill && GasBill) {
                        stopExcelLoop = true;
                        currentRowIndex = excelData.size();
                        return true;
                    }
                    // Check if paid one Electricity bill
                    if ( ("1".equals(categoryCode)) & ElectricityBill )
                    {
                        return false;
                    }

                    // Check if paid one Water bill
                    if (("2".equals(categoryCode)) & WaterBill )
                    {
                        return false;
                    }

                    // Check if paid one Gas bill
                    if (("3".equals(categoryCode)) & GasBill )
                    {
                        return false;
                    }

                    return true;
                // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 3— Navigate USSD Framework
                case 3:
                    refreshCurrentUrl();
                    UssdDef.switchToUssdFrame();

                    // Pass values to function for implementation
                    UssdDef.enterMsisdnInUssdPage(msisdn);
                    UssdDef.enterShortCodeInUssdPage(shortcode);
                    UssdDef.clickOnSendButtonInUssdPageWithMsisdnAndShortcode(msisdn, shortcode);

                    // Save Initial balance before transaction
                    UssdDef.enterOptionsInUssd(balanceInquiryOptions);
                    storeInitialBalanceBeforeTransaction();

                    refreshCurrentUrl();
                    UssdDef.switchToUssdFrame();

                    return true;

                // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 4— Generate Bill Payment Ussd Code
                case 4:
                    currentBillPaymentCode = GenerateBillPaymentCode(companyCategory);

                    // Pass values to function for implementation
                    refreshCurrentUrl();
                    UssdDef.switchToUssdFrame();
                    UssdDef.enterMsisdnInUssdPage(msisdn);
                    UssdDef.enterShortCodeInUssdPage(shortcode);
                    UssdDef.clickOnSendButtonInUssdPageWithMsisdnAndShortcode(msisdn, shortcode);
                    enterOptionsInUssdDirect(currentBillPaymentCode);

                    return true;
                // ─────────────────────────────────────────────────────────────────────────────────────//
                // STEP 5- Validate MessageResopnse text appeared correctly and amount < 50 LE
                case 5:
                    boolean checkMessageToContinue1 = validateActualResponseForAmountLessThan50LE(expectedResponseForCheckBillLessThan50LE);
                    return checkMessageToContinue1;
                // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 6— Generate Confirmation Payment Ussd Code
                case 6:
                    confirmationPaymentCode = GenerateConfirmationPaymentCode(companyCategory);

                    refreshCurrentUrl();
                    UssdDef.switchToUssdFrame();
                    UssdDef.enterMsisdnInUssdPage(msisdn);
                    UssdDef.enterShortCodeInUssdPage(shortcode);
                    UssdDef.clickOnSendButtonInUssdPageWithMsisdnAndShortcode(msisdn, shortcode);
                    enterOptionsInUssdDirect(confirmationPaymentCode);

                    return true;
                // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 7— Validate MessageResopnse text appeared "Payment done or not"
                case 7:
                    boolean checkMessageToContinue2 =  validateActualResponseForConfirmationPayment(expectedResponseForConfirmationPayment);
                    return checkMessageToContinue2;
                // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 8— Calculate deducted amount from wallet balance
                case 8:

                    refreshCurrentUrl();

                    UssdDef.switchToUssdFrame();
                    UssdDef.enterMsisdnInUssdPage(msisdn);
                    UssdDef.enterShortCodeInUssdPage(shortcode);
                    UssdDef.clickOnSendButtonInUssdPageWithMsisdnAndShortcode(msisdn, shortcode);
                    UssdDef.enterOptionsInUssdPage(balanceInquiryOptions);

                    storeBalanceAfterTransaction();
                    getInitialBalanceBeforeTransaction();
                    getBalanceAfterTransaction();
                    calculateDeductedAmountFromWalletBalance();
                    getTransactionAmount();

                    return true;
                // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 9— validate that deducted amount from wallet balance equal
                // to extracted transaction amount
                case 9:
                   checkThatDeductedAmountFromWalletBalanceEqualToExtractedTransactionAmount(categoryCode);
                     return true;
                // ─────────────────────────────────────────────────────────────────────────────────────//

                default:
                    return false;
            }

        } catch (Exception e) {
            return false;
        }
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Function tha pass BTC_Name to load all data for specific every Company
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private void loadCompanyData(String BTC_NAME) throws Exception {
        selectedCompany = CompanyType.fromName(BTC_NAME);
        if (selectedCompany == null) {
            throw new Exception("Company name NOT found in enum: " + BTC_NAME);
        }

        companyCode = selectedCompany.getCode();
        companyCategory = selectedCompany.getCategory();
        categoryCode = companyCategory.getCode();
    }
