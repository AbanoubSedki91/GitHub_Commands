  @USSD @Staging @Production @BillPayment
  Scenario Outline: Automate Bill Payment Flow Using Data Provider via Excel Sheet
    #Read row by row from Excel sheet to start testing
    Given Read Data Testing From Excel Sheet
    And   Load Company Data
    And   IsBillPaid
    And   Reload the current page
    And   Navigate to ussdFrame

  # --- Store Initial Balance Before Transaction--- #
    When Start working on USSD framework
    And  Put msisdn "<msisdn>" in ussd page
    And  Put shortcode "<shortCode>" in ussd page
    And  Press on send button in ussd page with msisdn "<msisdn>" and shortcode "<shortCode>"
    And  Put options "<balanceInquiryOptions>" in ussd
    And  Save initial balance before transaction
    And  Reload the current page
    And  Navigate to ussdFrame

#-------------------------------------------------------------------------------------------#
    # --- Check Bill Balance Less Than 50LE and Ready to pay--- #
    When Generate bill payment code for current category
    And  Put msisdn "<msisdn>" in ussd page
    And  Put shortcode "<shortCode>" in ussd page
    And  Press on send button in ussd page with msisdn "<msisdn>" and shortcode "<shortCode>"
    And  Put options "<BillPaymentCode>" in ussd
    And  validate That Actual Response For Amount Less Than 50LE "<expectedResponse>"
    And  Reload the current page
    And  Navigate to ussdFrame

#-------------------------------------------------------------------------------#
  # --- Confirmation Payment for every specific Bill --- #
    When Generate Confirmation Payment Code
    And  Put msisdn "<msisdn>" in ussd page
    And  Put shortcode "<shortCode>" in ussd page
    And  Press on send button in ussd page with msisdn "<msisdn>" and shortcode "<shortCode>"
    And  Put options "<ConfirmationPaymentCode>" in ussd

  # --- Calculate Deducted Amount From Wallet Balance--- #
    When Put msisdn "<msisdn>" in ussd page
    And  Put shortcode "<shortCode>" in ussd page
    And  Press on send button in ussd page with msisdn "<msisdn>" and shortcode "<shortCode>"
    And  Put options "<balanceInquiryOptions>" in ussd
    And  Save balance after transaction
    And  Fetch initial balance before transaction
    And  Fetch balance after transaction
    And  Compute deducted amount from wallet balance
    And  Fetch transaction amount

    #
    Then validate that deducted amount from wallet balance equal to extracted transaction amount
    #

    Examples:
      | msisdn           | shortCode | balanceInquiryOptions        | BillPaymentCode  | ConfirmationPaymentCode |  expectedResponse |
      | MsisdnPostpaid01 | shortCode | checkAvailableBalanceOptions | billpaymentcode  | confirmationpaymentcode |  expectedResponseForCheckBillLessThan50LE |





