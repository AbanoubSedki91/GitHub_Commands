
  @USSD @Staging @Production @BillPayment
  Scenario Outline: Automate Bill Payment Flow Using Data Provider via Excel Sheet
    #Read row by row from Excel sheet to start testing
    Given Read Data Testing From Excel Sheet
    And Load Company Data
    And IsBillPaid
    And Reload the current page
    And Navigate to ussdFrame

  # --- Store Initial Balance Before Transaction--- #
    When Start working on USSD framework
    And Put msisdn "<msisdn>" in ussd page
    And Put shortcode "<shortCode>" in ussd page
    And Press on send button in ussd page with msisdn "<msisdn>" and shortcode "<shortCode>"
    And Put options "<balanceInquiryOptions>" in ussd
    And Save initial balance before transaction
    And Reload the current page
    And Navigate to ussdFrame

#-------------------------------------------------------------------------------------------#
    # --- Check Bill Balance Less Than 50LE and Ready to pay--- #
    When Generate bill payment code for current category
    And  Put msisdn "<msisdn>" in ussd page
    And  Put shortcode "<shortCode>" in ussd page
    And  Press on send button in ussd page with msisdn "<msisdn>" and shortcode "<shortCode>"
    And  Put options "<BillPaymentCode>" in ussd
    And  validate That Actual Response For Amount Less Than 50LE "<expectedResponse>"
    And  Reload the current page
    And  Navigate to ussdFrame

#-------------------------------------------------------------------------------#
  # --- Confirmation Payment for every specific Bill --- #
    When Generate Confirmation Payment Code
    And  Put msisdn "<msisdn>" in ussd page
    And  Put shortcode "<shortCode>" in ussd page
    And  Press on send button in ussd page with msisdn "<msisdn>" and shortcode "<shortCode>"
    And  Put options "<ConfirmationPaymentCode>" in ussd

    # Validation expected message
    #Validate on expected response


    #Adapt loop for every row

    And CheckPaidSuccessfully

    And  Reload the current page
    And  Navigate to ussdFrame

  # --- Calculate Deducted Amount From Wallet Balance--- #
    When enter msisdn "<msisdn>" in ussd page
    And enter shortcode "<shortCode>" in ussd page
    And click on send button in ussd page with msisdn "<msisdn>" and shortcode "<shortCode>"
    And  enter options "<balanceInquiryOptions>" in ussd


    And store balance after transaction
    And get initial balance before transaction
    And get balance after transaction
    And calculate deducted amount from wallet balance
    And get transaction amount
    Then validate that deducted amount from wallet balance equal to extracted transaction amount



    Examples:
      | msisdn           | shortCode | balanceInquiryOptions        | BillPaymentCode  | ConfirmationPaymentCode |  expectedResponse |
      | MsisdnPostpaid01 | shortCode | checkAvailableBalanceOptions | billpaymentcode  | confirmationpaymentcode |  expectedResponseForCheckBillLessThan50LE |
//------------------------------------------------------------------------------------------------------------------------------------------------------------------//
package com.vodafone.cash_taf.tests.bill_payment.stepdefinitions;

import com.vodafone.cash_taf.tests.bill_payment.utils.ExcelUtils;
import com.vodafone.cash_taf.tests.bill_payment.Enum.CategoryType;
import com.vodafone.cash_taf.tests.bill_payment.Enum.CompanyType;
import io.cucumber.java.en.*;


import java.util.List;
import java.util.Properties;

public class StepDefs
{

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Private Variables to store CompanyName , CompanyCode , CompanyCategory
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private String companyCode;
    private String categoryCode;
    private CategoryType companyCategory;
    private CompanyType selectedCompany;

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Billing Account Number and Billing Payment USSD Code
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private String billingAccountNumber;
    private String currentBillPaymentCode;
    private String confirmationPaymentCode;


    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Private Variables to store Bill paid or not
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private boolean ElectricityBill = false;
    private boolean WaterBill = false;
    private boolean GasBill = false;

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Given Variables for read Testing Data from Excel sheet
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private boolean stopExcelLoop = false;
    private static List<String[]> excelData;
    private static int currentRowIndex = 0;
    private String[] currentRow;

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Properties object to simulate USSD options storage
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private Properties ussdRatePlanPropertiesUtilities = new Properties();
    private Properties ussdConfirmationPaymentCode = new Properties();

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Create Object "ussdSteps" for using USSD framework
    // ─────────────────────────────────────────────────────────────────────────────────────//
    UssdSteps ussdSteps = new UssdSteps();

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //  Read Values from Placeholder "msisdn" , "shortCode" , "checkAvailableBalanceOptions"
    // "expectedResponseForCheckBillLessThan50LE"
    // ─────────────────────────────────────────────────────────────────────────────────────//
    String msisdnPlaceholder = ussdRatePlanPropertiesUtilities.getProperty("<msisdn>");
    String shortCodePlaceholder = ussdRatePlanPropertiesUtilities.getProperty("<shortCode>");
    String balanceInquiryOptionsPlaceholder = ussdRatePlanPropertiesUtilities.getProperty(("<balanceInquiryOptions>"));
    String expectedResponseForCheckBillLessThan50LE = ussdRatePlanPropertiesUtilities.getProperty(("<expectedResponse>"));



    // ─────────────────────────────────────────────────────────────────────────────────────//
    //                 GIVEN Read Data Testing From Excel Sheet
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @Given("Read Data Testing From Excel Sheet")
    public void Start_Scenario()
    {
        if (excelData == null) {
            excelData = ExcelUtils.readAllRows(
                    "D:/AutomationWork/Cash_Regression_Framework/" +
                            "VFCash_Regression_Framework/VFCash_Framework/resources/Data/DataTesting.xlsx"
            );
        }

        while (currentRowIndex < excelData.size())
        {
            // Stop Read from Excel sheet if paid 3 bills "Electricity , Water , Gas"
            if (stopExcelLoop)
            {
                break;  // Stop reading Excel rows
            }

            currentRow = excelData.get(currentRowIndex);

            // STEP 1- Load Company Data
            if (!executeStep(1)) {currentRowIndex++;continue;}

            // STEP 2- IsBillPaid
            if (!executeStep(2)) {currentRowIndex++;continue;}

            // STEP 3- USSD Framework for implementation
            if (!executeStep(3)) {currentRowIndex++;continue;}

            // STEP 4- Generate Bill Payment Ussd Code
            if (!executeStep(4)) {currentRowIndex++;continue;}

            // STEP 5- Validate MessageResopnse text appeared correctly and amount < 50 LE
            if (!executeStep(5)) {currentRowIndex++;continue;}

            // STEP 6- Validate MessageResopnse text appeared correctly and amount < 50 LE
            if (!executeStep(6)) {currentRowIndex++;continue;}






            // STEP 4- pending
            if (!executeStep(333333))
            {
                currentRowIndex++;
                continue;
            }

            // STEP 5- Generate Confirmation Bill Payment Ussd Code
            if (!executeStep(555555))
            {
                currentRowIndex++;
                continue;
            }


            // STEP 6- Pending
            if (!executeStep(666666))
            {
                currentRowIndex++;
                continue;
            }

            currentRowIndex++;
        }

    }

    // ─────────────────────────────────────────────────────────────────────────────────────//
    //                 Steps Implementation For every bill
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @And ("Load Company Data")
    public void step1(){ }

    @And ("IsBillPaid")
    public void step2(){ }

    @And ("Start working on USSD framework")
    public void step3() {}

    @And ("Generate bill payment code for current category")
    public void step4(){ }

    @And ("Generate Confirmation Payment Code")
    public void step6(){ }


    // ─────────────────────────────────────────────────────────────────────────────────────//
    //        Function tha pass BTC_Name to load all data for specific every Company
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private void loadCompanyData(String BTC_NAME) throws Exception
    {
        selectedCompany = CompanyType.fromName(BTC_NAME);
        if (selectedCompany == null)
        {
            throw new Exception("Company name NOT found in enum: " + BTC_NAME);
        }

        companyCode     = selectedCompany.getCode();
        companyCategory = selectedCompany.getCategory();
        categoryCode = companyCategory.getCode();
    }
//───────────────────────────────────────────────────────────────────────────────────────────────//
    // ─────────────────────────────────────────────────────────────────────────────────────//
    //                          Generate Bill Payment USSD Code
    // ─────────────────────────────────────────────────────────────────────────────────────//
    public String GenerateBillPaymentCode(CategoryType category) {
        switch (category)
        {
            case ELECTRICITY:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1";
            case WATER:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1";
            case GAS:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1" ;
            default:
                return "";
        }
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    //            Set placeholder for BillPaymentCode to check invoice amount
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @Then("Set BillPaymentCode placeholder")
    public void setBillPaymentCodePlaceholder()
    {
        if (currentRowIndex >= excelData.size()) return;
        ussdRatePlanPropertiesUtilities .setProperty("<BillPaymentCode>", currentBillPaymentCode);
    }
//───────────────────────────────────────────────────────────────────────────────────────────────//
    // ─────────────────────────────────────────────────────────────────────────────────────//
    //                          Generate Confirmation Payment USSD Code
    // ─────────────────────────────────────────────────────────────────────────────────────//
    public String GenerateConfirmationPaymentCode(CategoryType category) {
        switch (category) {
            case ELECTRICITY:
                return "4," + categoryCode+ "," + companyCode + "," + billingAccountNumber + ",1" + ",100100";
            case WATER:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1" + ",100100";
            case GAS:
                return "4," + categoryCode + "," + companyCode + "," + billingAccountNumber + ",1" + "100100" ;
            default:
                return "";
        }
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    //            Set placeholder for  Confirmation Bill Payment Ussd Code
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @Then("Set ConfirmationPaymentCode placeholder")
    public void setConfirmationPaymentCodePlaceholder()
    {
        if (currentRowIndex >= excelData.size()) return;
        ussdConfirmationPaymentCode .setProperty("<confirmationpaymentcode>", confirmationPaymentCode);
    }
//───────────────────────────────────────────────────────────────────────────────────────────────//
    // ─────────────────────────────────────────────────────────────────────────────────────//
    //                                EXECUTE EACH STEP
    // ─────────────────────────────────────────────────────────────────────────────────────//
    private boolean executeStep(int stepNumber) {
        try {
            switch (stepNumber) {
                // Step 1— Load company name
                case 1:
                    String btcName = currentRow[1];
                    loadCompanyData(btcName);
                    billingAccountNumber = currentRow[10];
                    return true;
      // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 2— Check 3 bills is paid or not
                case 2:
                    if (ElectricityBill && WaterBill && GasBill)
                    {
                        stopExcelLoop = true;
                        currentRowIndex = excelData.size();
                        return true;
                    }
                    return true;
      // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 3— Navigate USSD Framework
                case 3:
                    ussdSteps.reloadCurrentUrl();
                    ussdSteps.navigateToUssdFrame();

                    if (msisdnPlaceholder == null || shortCodePlaceholder == null)
                    {
                        throw new Exception("Placeholders <msisdn> or <shortCode> not set in properties");
                    }

                    // Pass values to function for implementation
                    ussdSteps.putMsisdnInUssdPage(msisdnPlaceholder);
                    ussdSteps.putShortCodeInUssdPage(shortCodePlaceholder);
                    ussdSteps.pressOnSendButtonInUssdPageWithMsisdnAndShortcode(msisdnPlaceholder, shortCodePlaceholder);

                    // Save Initial balance before transaction
                    ussdSteps.putOptionsInUssd(balanceInquiryOptionsPlaceholder);
                    ussdSteps.saveInitialBalanceBeforeTransaction();

                    ussdSteps.reloadCurrentUrl();
                    ussdSteps.navigateToUssdFrame();

                    return true;
      // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 4— Generate Bill Payment Ussd Code
                case 4:
                    currentBillPaymentCode = GenerateBillPaymentCode(companyCategory);
                    setBillPaymentCodePlaceholder();

                    // Pass values to function for implementation
                    ussdSteps.putMsisdnInUssdPage(msisdnPlaceholder);
                    ussdSteps.putShortCodeInUssdPage(shortCodePlaceholder);
                    ussdSteps.pressOnSendButtonInUssdPageWithMsisdnAndShortcode(msisdnPlaceholder, shortCodePlaceholder);
                    ussdSteps.putOptionsInUssd(currentBillPaymentCode);

                    return true;
      // ─────────────────────────────────────────────────────────────────────────────────────//
                // STEP 5- Validate MessageResopnse text appeared correctly and amount < 50 LE
                case 5:
                    boolean checkMessageToContinue = ussdSteps.validateActualResponseForAmountLessThan50LE(expectedResponseForCheckBillLessThan50LE);
                    return checkMessageToContinue;
      // ─────────────────────────────────────────────────────────────────────────────────────//
                // Step 6— Generate Confirmation Payment Ussd Code
                case 6:
                    confirmationPaymentCode = GenerateConfirmationPaymentCode(companyCategory);
                    setConfirmationPaymentCodePlaceholder();

                    ussdSteps.reloadCurrentUrl();
                    ussdSteps.navigateToUssdFrame();

                    ussdSteps.putMsisdnInUssdPage(msisdnPlaceholder);
                    ussdSteps.putShortCodeInUssdPage(shortCodePlaceholder);
                    ussdSteps.pressOnSendButtonInUssdPageWithMsisdnAndShortcode(msisdnPlaceholder, shortCodePlaceholder);
                    ussdSteps.putOptionsInUssd(confirmationPaymentCode);

                    return true;
      // ─────────────────────────────────────────────────────────────────────────────────────//



                default:
                    return false;
            }

        } catch (Exception e) {
            return false;
        }
    }


}
//---------------------------------------------------------------------------------------------------------------------------------------//
package com.vodafone.cash_taf.tests.bill_payment.stepdefinitions;

import com.vodafone.ussd_taf.tests.BaseTest;
import io.cucumber.java.en.And;
import io.cucumber.java.en.Then;
import io.cucumber.java.en.When;
import log4j.Log4jLogging;
import org.testng.Assert;

import java.util.List;

public class UssdSteps extends BaseTest
{
    Log4jLogging log4j = new Log4jLogging();
    List<String> list;

    public void bypassRequestInProgress ()
    {
        while (browser.ussd.networkBrowserStudio.getResponseText() != null) {
            String actualResponse = browser.ussd.networkBrowserStudio.getResponseText();
            System.out.println("Actual text: " + actualResponse);
            if (!actualResponse.contains("Request in progress")) {
                break;
            }
        }
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @When("Reload the current page")
    public void step1Ussd() {}

    public void reloadCurrentUrl() {
        edgeDriver.refreshCurrentUrl();
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @When("Navigate to ussdFrame")
    public void step2Ussd() {}

    public void navigateToUssdFrame() {
        browser.ussd.networkBrowserStudio.switchToUssdFrame();
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @When ("Put msisdn {string} in ussd page")
    public void step3Ussd() {}

    public void putMsisdnInUssdPage(String msisdn)
    {
        browser.ussd.networkBrowserStudio.enterMsisdnInTheMsisdnInputField(
                "2".concat(ussdRatePlanProperties.getProperty(msisdn)));
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @And ("Put shortcode {string} in ussd page")
    public void step4Ussd() {}

    public void putShortCodeInUssdPage(String shortCode)
    {
        browser.ussd.networkBrowserStudio.enterShortCode
                (ussdRatePlanProperties.getProperty(shortCode));
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @And ("Press on send button in ussd page with msisdn {string} and shortcode {string}")
    public void step5Ussd() {}

    public void pressOnSendButtonInUssdPageWithMsisdnAndShortcode(String msisdn, String shortCode)
    {
        browser.ussd.networkBrowserStudio.clickOnSendButton();
        log4j.logMsisdnAndAction(ussdRatePlanProperties.getProperty(msisdn), "","","",ussdRatePlanProperties.getProperty(shortCode),"","","");
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @And("Put options {string} in ussd")
    public void step6Ussd() {}

    public void putOptionsInUssd(String options) {
        list = browser.ussd.networkBrowserStudio.getTheList(ussdRatePlanProperties.getProperty(options));
        browser.ussd.networkBrowserStudio.showFinalUssdResponse(list);
        log4j.logMsisdnAndAction("", "","","","",browser.ussd.networkBrowserStudio.getResponseText(),"","");
        bypassRequestInProgress ();
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @And("Save initial balance before transaction")
    public void step7Ussd() {}

    public void saveInitialBalanceBeforeTransaction()
    {
        browser.ussd.networkBrowserStudio.storeInitialBalance();
    }
    // ─────────────────────────────────────────────────────────────────────────────────────//
    @And("validate That Actual Response For Amount Less Than 50LE {string}")
    public void step8Ussd() {}

    public boolean validateActualResponseForAmountLessThan50LE(String expectedResponse) {
        try {
            // Read real response message from USSD framework
            String actualResponse = browser.ussd.networkBrowserStudio.getResponseText().trim().replaceAll("\\s+", " ");

            // Validate Text on Response Message
            boolean containsText = actualResponse.trim().replaceAll("\\s+", " ")
                    .contains(expectedResponse.trim().replaceAll("\\s+", " "));

            // Validate transaction balance less than 50 LE
            String amountString = actualResponse.replaceAll("[^\\d]", "");
            int amount = !amountString.isEmpty() ? Integer.parseInt(amountString) : 0;
            boolean amountCheck = amount < 50;

            // Return True if two conditions achieved
            return containsText && amountCheck;

        } catch (Exception e) {
            return false;
        }
    }
}




